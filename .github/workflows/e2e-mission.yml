name: End-to-end mission reference

on:
  workflow_dispatch:

jobs:
  e2e-mission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run dependency-light end-to-end tests
        run: python -m pytest tests/test_e2e_mission.py -q
      - name: Execute sample mission
        run: python -m flood_robot.e2e_mission --input examples/e2e_flood_mission.json --output /tmp/mission-report.json
