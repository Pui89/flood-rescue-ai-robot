name: Benchmark report validator

on:
  pull_request:
    paths:
      - "tools/validate_benchmark_report.py"
      - "tests/test_benchmark_report_validator.py"
      - ".github/workflows/benchmark-validator.yml"
  push:
    branches:
      - main
      - feat/reproducible-benchmark-gates
    paths:
      - "tools/validate_benchmark_report.py"
      - "tests/test_benchmark_report_validator.py"
      - ".github/workflows/benchmark-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Test benchmark report validator
        run: python -m pytest -q tests/test_benchmark_report_validator.py
