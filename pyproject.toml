[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-rescue-ai-robot"
version = "0.1.0"
description = "AI flood-rescue robot with custom PyTorch depth estimation, object tracking, and spatial hazard forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.24.0",
  "opencv-python-headless>=4.8.0",
  "imageio>=2.31.0",
  "matplotlib>=3.8.0",
  "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flood_robot*"]
