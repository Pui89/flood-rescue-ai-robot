[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-rescue-ai-robot"
version = "0.2.0"
description = "Safety-aware multimodal flood-rescue robotics platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.24.0",
  "opencv-python-headless>=4.8.0",
  "imageio>=2.31.0",
  "matplotlib>=3.8.0",
  "pillow>=10.0.0",
  "transformers>=4.57.0",
  "accelerate>=1.10.0",
  "ultralytics>=8.4.0",
  "huggingface-hub>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flood_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
