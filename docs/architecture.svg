<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">PUI89 Flood Recon reference architecture</title><desc id="desc">Multimodal sensors feed a health gate, perception, mapping, hazard fusion and a deterministic safety supervisor, with operator review and audit evidence. Motion is gated.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b3c"/><stop offset="1" stop-color="#071522"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#80b9d0"/></marker></defs><rect width="1100" height="780" rx="24" fill="url(#bg)"/><text x="50" y="55" font-family="system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#5de1d0">PUI89 / FLOOD RECON</text><text x="50" y="91" font-family="system-ui,sans-serif" font-size="28" font-weight="750" fill="#eef6fb">Reference system architecture</text><text x="50" y="119" font-family="system-ui,sans-serif" font-size="14" fill="#a8bdca">Supervised reconnaissance · edge compute · auditable hazard evidence</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="280" y="150" width="540" height="70" rx="13" fill="#10283a" stroke="#3c6275"/><text x="550" y="178" font-size="17" font-weight="700" fill="#eef6fb">Multimodal sensor inputs</text><text x="550" y="200" font-size="13" fill="#a8bdca">RGB / depth / thermal / LiDAR / IMU / GNSS</text><path d="M550 220 V249" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="255" width="540" height="64" rx="13" fill="#113547" stroke="#5de1d0"/><text x="550" y="281" font-size="17" font-weight="700" fill="#eef6fb">Sensor contracts & health gate</text><text x="550" y="301" font-size="13" fill="#b7d9df">Freshness · calibration · timestamps · dropouts</text><path d="M550 319 V348" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="354" width="540" height="64" rx="13" fill="#10283a" stroke="#3c6275"/><text x="550" y="380" font-size="17" font-weight="700" fill="#eef6fb">Perception, tracking & uncertainty</text><text x="550" y="400" font-size="13" fill="#a8bdca">Detection / segmentation / OOD / confidence</text><path d="M550 418 V447" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="453" width="540" height="64" rx="13" fill="#10283a" stroke="#3c6275"/><text x="550" y="479" font-size="17" font-weight="700" fill="#eef6fb">World model & hazard fusion</text><text x="550" y="499" font-size="13" fill="#a8bdca">Map layers · provenance · unknown regions · confidence</text><path d="M550 517 V546" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="552" width="620" height="70" rx="13" fill="#2b2719" stroke="#ffcf75" stroke-width="1.5"/><text x="550" y="580" font-size="17" font-weight="700" fill="#ffe3a5">Deterministic safety supervisor</text><text x="550" y="602" font-size="13" fill="#d6c9a5">Watchdogs · stop/degrade policy · operator override</text><path d="M550 622 V651" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="657" width="390" height="72" rx="13" fill="#10283a" stroke="#3c6275"/><text x="295" y="685" font-size="16" font-weight="700" fill="#eef6fb">Operator console & mission report</text><text x="295" y="707" font-size="13" fill="#a8bdca">Map review · event log · evidence export</text><rect x="610" y="657" width="390" height="72" rx="13" fill="#10283a" stroke="#3c6275"/><text x="805" y="685" font-size="16" font-weight="700" fill="#eef6fb">Gated robot interface</text><text x="805" y="707" font-size="13" fill="#a8bdca">ROS 2 / Nav2 only after validation gates</text><path d="M440 622 V641 H295 V657" fill="none" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 622 V641 H805 V657" fill="none" stroke="#80b9d0" stroke-width="2" marker-end="url(#arrow)"/></g><text x="50" y="758" font-family="system-ui,sans-serif" font-size="12" fill="#a8bdca">Design reference only — not a validated safety case or proof of field performance.</text></svg>