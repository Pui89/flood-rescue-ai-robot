<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Flood Rescue AI animated concept demo</title><desc id="desc">Concept animation showing a flooded map, a simulated rescue robot, a detected person marker, and route planning with human review.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b2b49"/><stop offset="1" stop-color="#081a2d"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#279bc2"/><stop offset="1" stop-color="#14548c"/></linearGradient></defs>
<rect width="960" height="540" rx="24" fill="url(#bg)"/><text x="38" y="48" fill="#8ee7ff" font-family="Arial" font-size="17" letter-spacing="3">AI APPLICATION / CONCEPT SIMULATION</text><text x="38" y="88" fill="white" font-family="Arial" font-size="30" font-weight="700">Flood Rescue AI</text>
<rect x="35" y="115" width="610" height="385" rx="18" fill="#17364c" stroke="#35718b"/><path d="M45 180 L190 148 L260 202 L390 150 L635 195 L635 490 L45 490Z" fill="#6a7d73"/><path d="M45 275 Q120 240 195 282 T350 270 T500 290 T635 267 L635 490 L45 490Z" fill="url(#water)"><animate attributeName="d" values="M45 275 Q120 240 195 282 T350 270 T500 290 T635 267 L635 490 L45 490Z;M45 286 Q120 250 195 270 T350 282 T500 270 T635 281 L635 490 L45 490Z;M45 275 Q120 240 195 282 T350 270 T500 290 T635 267 L635 490 L45 490Z" dur="5s" repeatCount="indefinite"/></path>
<g fill="#d2c7a7" stroke="#f1e7c8" stroke-width="2"><rect x="90" y="200" width="60" height="46" rx="4"/><path d="M82 202 L120 172 L158 202Z"/><rect x="475" y="190" width="72" height="48" rx="4"/><path d="M466 192 L511 160 L556 192Z"/><rect x="220" y="150" width="54" height="39" rx="4"/></g>
<g transform="translate(140 337)"><rect x="0" y="0" width="105" height="50" rx="12" fill="#dce8ef" stroke="#7fe8ff" stroke-width="3"/><circle cx="23" cy="51" r="12" fill="#142a38" stroke="#99b5c5" stroke-width="5"/><circle cx="80" cy="51" r="12" fill="#142a38" stroke="#99b5c5" stroke-width="5"/><rect x="28" y="-14" width="48" height="18" rx="5" fill="#ffbf69"/><circle cx="52" cy="-5" r="5" fill="#102a3b"/><path d="M50 -14 L50 -30" stroke="#dce8ef" stroke-width="4"/><circle cx="50" cy="-34" r="6" fill="#7fe8ff"/></g>
<path d="M245 356 Q320 315 390 340 T485 300" fill="none" stroke="#ffe07a" stroke-width="5" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.8s" repeatCount="indefinite"/></path>
<g transform="translate(495 285)"><circle r="22" fill="none" stroke="#ff7070" stroke-width="3"><animate attributeName="r" values="17;27;17" dur="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/></circle><circle r="7" fill="#ff7070"/><text x="30" y="4" fill="#fff1e8" font-family="Arial" font-size="13">Person marker (simulated)</text></g>
<g stroke="#8fe8ff" stroke-width="1.5" opacity=".35"><path d="M65 220 H610 M65 320 H610 M65 420 H610 M165 135 V480 M265 135 V480 M365 135 V480 M465 135 V480 M565 135 V480"/></g>
<rect x="672" y="115" width="253" height="385" rx="18" fill="#0b2337" stroke="#35718b"/><text x="697" y="151" fill="#e0f7ff" font-family="Arial" font-size="17" font-weight="700">RESCUE OVERVIEW</text>
<text x="697" y="194" fill="#9fc2d4" font-family="Arial" font-size="13">Flood-risk estimate</text><rect x="697" y="207" width="202" height="9" rx="4" fill="#23445a"/><rect x="697" y="207" width="142" height="9" rx="4" fill="#49c4e8"><animate attributeName="width" values="120;158;142" dur="4s" repeatCount="indefinite"/></rect>
<text x="697" y="249" fill="#9fc2d4" font-family="Arial" font-size="13">Route status</text><text x="897" y="249" fill="#ffffff" text-anchor="end" font-family="Arial" font-size="18" font-weight="700">SIMULATED</text>
<rect x="697" y="270" width="202" height="46" rx="9" fill="#173d53"/><circle cx="716" cy="293" r="6" fill="#ffe07a"/><text x="733" y="298" fill="#fff1c0" font-family="Arial" font-size="13">Avoid deep-water zones</text>
<text x="697" y="355" fill="#9fc2d4" font-family="Arial" font-size="13">Mission workflow</text><g transform="translate(698 370)"><circle cx="12" cy="12" r="10" fill="#49c4e8"/><text x="12" y="16" fill="#08273a" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">1</text><text x="31" y="17" fill="#e0f7ff" font-family="Arial" font-size="13">Map → detect → plan</text></g><g transform="translate(698 407)"><circle cx="12" cy="12" r="10" fill="#ffe07a"/><text x="12" y="16" fill="#40310a" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">2</text><text x="31" y="17" fill="#fff1c0" font-family="Arial" font-size="13">Human review required</text></g>
<text x="38" y="525" fill="#9fc2d4" font-family="Arial" font-size="12">ANIMATED CONCEPT ONLY • NOT FIELD-VALIDATED • NO REAL RESCUE DISPATCH</text></svg>